optimizer:
  #  Adam-oriented deep learning
  name: AdamW
  #  These are all default parameters for the Adam optimizer
  space_group_lr: 1e-3
  lattice_lr: 1e-4
  wyckoff_transformer_lr: 1e-4
  diffusion_lr: 1e-3
  default_lr: 1e-3
  betas: [ 0.9, 0.999 ]
  eps: 1e-08
  weight_decay: 0

use_lr_scheduler: True
lr_scheduler:
  name: ReduceLROnPlateau
  factor: 0.6
  patience: 30  # number of epochs without improvement
  min_lr: 1e-5

gradient_clip_val: 0.5
gradient_clip_algorithm: value  # [null, value]
batch_size: ${dataset.batch_size}
num_epochs: ${dataset.num_epochs}

# Data augmentation
lattice_length_noise: 0.15  # Angstroms
lattice_angle_noise: 2.5  # Degrees