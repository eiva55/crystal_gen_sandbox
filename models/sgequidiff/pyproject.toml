[project]
name = "sgequidiff"
version = "1.0.0"
description = "SGEquiDiff is a crystal generative diffusion model that leverages space group equivariance to enforce space group symmetry constraints"
requires-python = ">= 3.10"
readme = "README.md"
license = "MIT"
urls.repository = "https://github.com/rees-c/sgequidiff"

dependencies = [
    "torch==2.6.0",
    "torch_geometric==2.6.1",
    "pymatgen==2023.10.11",
    "pyxtal==0.6.0",
    "matminer==0.9.2",
    "smact==2.2.1",
    "meshpy==2022.1.3",
    "p-tqdm==1.4.0",
    "hydra-core",
    "wandb",
    "cloudpickle==3.1.1",
    "torch-scatter==2.1.2",
    "torchdiffeq==0.2.5",
    "numpy==1.26.4",
    "ruamel.yaml==0.17.21",
]

[tool.uv.sources]
torch = [
    { index = "pytorch_linux",  marker = "sys_platform == 'linux'" }
]
torch-scatter = [
    { url = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_scatter-2.1.2%2Bpt26cu124-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'"},
]

[[tool.uv.index]]
name = "pytorch_linux"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=77.0.3,<81.0.0"]
build-backend = "setuptools.build_meta"